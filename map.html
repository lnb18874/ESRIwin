<html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>GeoScene Maps SDK for JavaScript Tutorials: Display a Web Map</title>
  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }
  </style>
  <link rel="stylesheet" href="https://js.geoscene.cn/4.29/geoscene/themes/light/main.css">
  <script src="https://js.geoscene.cn/4.29/"></script>

  <script>
    require([
      "geoscene/config",
      "geoscene/WebMap",
      "geoscene/views/MapView",
      "geoscene/widgets/ScaleBar",
      "geoscene/widgets/Legend"
    ], function(geosceneConfig, WebMap, MapView, ScaleBar, Legend) {
      const webmap = new WebMap({
        portalItem: {
          id: "2a78a76e9a4144f9873355367ae76e26"
        }
      });

      const view = new MapView({
        container: "viewDiv",
        map: webmap

      });

      const scalebar = new ScaleBar({
        view: view
      });

      view.ui.add(scalebar, "bottom-left");

      const legend = new Legend ({
        view: view
      });
      view.ui.add(legend, "top-right");

  });
  </script>
</head>
<body>
  <div id="viewDiv"></div>

</body></html>
